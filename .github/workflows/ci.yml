name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  headless:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build and test headless under ASan and UBSan
        run: bin/build linux-asan
